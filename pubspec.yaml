name: resume_ai_app
description: "🚀 AI-powered Android Resume Builder for students and job seekers. Built with Flutter, Firebase, and modern clean architecture to generate ATS-friendly resumes, professional templates, AI suggestions, and PDF exports in minutes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_ml_vision: ^0.12.0+2
  google_generative_ai: ^0.3.0
  pdf: ^3.10.4
  printing: ^5.11.0
  provider: ^6.1.0
  get_it: ^7.6.0
  intl: ^0.19.0
  flutter_riverpod: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/templates/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
